; Opcache production — file cache tidak divalidasi ulang tiap request
; (validate_timestamps=0), sesuai dengan pola deploy: image baru = restart
; container, bukan edit file di tempat.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=0
