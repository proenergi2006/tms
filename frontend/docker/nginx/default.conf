# Satu domain untuk SPA + API. /api dan /storage di-proxy langsung ke
# public/index.php di container "app" (backend) lewat fastcgi — SCRIPT_FILENAME
# di-set manual (bukan lewat try_files) karena document root nginx di sini
# adalah dist/ frontend, bukan public/ backend, jadi tidak bisa saling
# resolve path lewat filesystem yang sama. Laravel tetap merutekan dengan
# benar dari REQUEST_URI (disediakan fastcgi_params bawaan nginx), jadi
# SCRIPT_NAME/SCRIPT_FILENAME statis ke index.php sudah cukup.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location ~ ^/(api|storage|up)(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 300;
    }

    # SPA fallback — route Vue Router (mis. /fleets/12) ditangani client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
